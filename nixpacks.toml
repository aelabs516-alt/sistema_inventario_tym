[phases.setup]
nixPkgs = ["python3", "gcc"]

[phases.install]
cmds = ["python -m venv /opt/venv", ". /opt/venv/bin/activate", "pip install -r requirements.txt"]

[phases.build]
cmds = [
    ". /opt/venv/bin/activate",
    "python manage.py collectstatic --noinput",
    "python manage.py migrate"
]

[start]
cmd = ". /opt/venv/bin/activate && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-4} --threads ${GUNICORN_THREADS:-4} --worker-class gthread --timeout 120 --max-requests 1000 --max-requests-jitter 100"
